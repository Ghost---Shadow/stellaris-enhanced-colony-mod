 eca_mod_name:0 "Enhanced Colony Automation AI"
 eca_mod_desc:0 "Improves colony automation with comprehensive building lists, resource deficit awareness, and proactive infrastructure."
 col_eca_capital:0 "Enhanced Capital"
 col_eca_capital_desc:0 "Enhanced automation for empire capitals. Proactive building of research, industry, amenities, and strategic resources.\n\n§Y[ECA] Automation Rules:§!\n§H• Foundry:§! only when £alloys£ Alloys income < §R+3/month§!\n§H• Factory:§! only when £consumer_goods£ CG income < §R+3/month§!\n§H• Research Lab:§! requires £consumer_goods£ CG surplus >= §G+10/month§!\n§H• Districts:§! built proactively when all pops are employed\n§H• Stability:§! precinct/stronghold if stability < §R50§!\n§H• Amenities:§! holo theatre if amenities < §R0§!\n§H• Gene Clinic & Robot Assembly:§! built automatically\n§H• Cost Buffer:§! requires 2x mineral stockpile to build"
 col_eca_mining:0 "Enhanced Mining World"
 col_eca_mining_desc:0 "Enhanced automation specializing in §SMinerals§! production with deficit-aware industry support.\n\n§Y[ECA] Automation Rules:§!\n§H• Mining Districts:§! built proactively when all pops are employed\n§H• Foundry:§! only when £alloys£ Alloys income < §R+3/month§!\n§H• Factory:§! only when £consumer_goods£ CG income < §R+3/month§!\n§H• Stability:§! precinct/stronghold if stability < §R50§!\n§H• Amenities:§! holo theatre if amenities < §R0§!\n§H• Cost Buffer:§! requires 2x mineral stockpile to build"
